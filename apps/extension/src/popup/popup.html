<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --ld-ink: #1f2328;
        --ld-muted: #59636e;
        --ld-line: #d1d9e0;
      }
      body {
        margin: 0;
        width: 320px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #fff;
      }
      /* Dark overrides last, so the cascade cannot hand the light base a win. */
      @media (prefers-color-scheme: dark) {
        :root { --ld-ink: #f0f6fc; --ld-muted: #9198a1; --ld-line: #3d444d; }
        body { background: #0d1117; }
        select, option { background: #0d1117; color: #f0f6fc; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
