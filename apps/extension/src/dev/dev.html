<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LowDiff overlay harness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap"
    />
    <style>
      body { margin: 0; background: #eef1f6; }
      .page { max-width: 1100px; margin: 24px auto; background: #fff; border-radius: 14px; padding: 24px; }
    </style>
  </head>
  <body>
    <div class="page">
      <div id="root"></div>

      <!--
        A stand-in for GitHub's client-rendered diff, using the same semantic
        attributes the modern adapter reads. Without it the harness has nothing
        to attach badges to, and the whole placement path goes untested.
      -->
      <div id="diff-comparison-viewer-container">
        <table role="grid" aria-label="Diff for: src/search/useSearch.ts" data-diff-anchor="diff-a">
          <tbody>
            <tr>
              <td data-diff-side="right" data-line-number="25" data-first-unified-line-number-cell="false">25</td>
              <td data-diff-side="right" data-line-number="25" data-line-anchor="diff-aR25">+  const debounced = useDebounce(query, 300);</td>
            </tr>
            <tr>
              <td data-diff-side="right" data-line-number="26" data-first-unified-line-number-cell="false">26</td>
              <td data-diff-side="right" data-line-number="26" data-line-anchor="diff-aR26">+  const results = fetchResults(debounced);</td>
            </tr>
          </tbody>
        </table>
        <table role="grid" aria-label="Diff for: src/api/client.ts" data-diff-anchor="diff-b">
          <tbody>
            <tr>
              <td data-diff-side="right" data-line-number="59" data-first-unified-line-number-cell="false">59</td>
              <td data-diff-side="right" data-line-number="59" data-line-anchor="diff-bR59">+  term: string,</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <script type="module" src="./dev.js"></script>
  </body>
</html>
